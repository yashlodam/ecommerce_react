<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#00927c"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Subtle Ambient Ring -->
  <circle cx="256" cy="256" r="210" stroke="url(#tealGlow)" stroke-width="6" stroke-opacity="0.25" fill="none"/>

  <!-- Shopping Bag Body with Curved Base -->
  <path d="M160 190 C160 170, 175 155, 195 155 L317 155 C337 155, 352 170, 352 190 L368 375 C368 405, 345 425, 315 425 L197 425 C167 425, 144 405, 144 375 Z" fill="url(#bagGrad)" filter="url(#glow)"/>

  <!-- Shopping Bag Handles (Arched) -->
  <path d="M205 160 V125 C205 95, 225 75, 256 75 C287 75, 307 95, 307 125 V160" stroke="#f0fdfa" stroke-width="26" stroke-linecap="round" fill="none"/>

  <!-- Stylized ShopSphere 'S' Dynamic Ribbon across the bag -->
  <path d="M305 220 C240 210, 190 235, 205 270 C220 305, 295 300, 310 335 C325 370, 260 395, 205 385" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Orbital Commerce Ring wrapping the sphere -->
  <ellipse cx="256" cy="265" rx="195" ry="75" stroke="url(#tealGlow)" stroke-width="14" stroke-linecap="round" transform="rotate(-25 256 265)" fill="none" opacity="0.9"/>

  <!-- Sparkle / Notification Star -->
  <circle cx="360" cy="150" r="24" fill="url(#goldDot)" filter="url(#glow)"/>
</svg>